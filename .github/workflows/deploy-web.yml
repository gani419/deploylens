name: Deploy web service

on:
  workflow_dispatch:
    inputs:
      deploy_firebase_frontend:
        description: Also deploy Firebase Hosting with the Cloud Run API rewrite
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy complete web and inspection service
        run: |
          gcloud run deploy deploylens \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region asia-east1 \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 2 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --use-http2 \
            --set-env-vars NODE_ENV=production,HOST=0.0.0.0,DEPLOYLENS_HTTP2=1
      - name: Install web dependencies
        if: inputs.deploy_firebase_frontend
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v7
        if: inputs.deploy_firebase_frontend
        with:
          node-version: 22
          cache: pnpm
      - name: Build Firebase frontend
        if: inputs.deploy_firebase_frontend
        run: pnpm install --frozen-lockfile && pnpm web:build
      - name: Deploy Firebase Hosting
        if: inputs.deploy_firebase_frontend
        run: npx --yes firebase-tools@latest deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"
      - name: Show service URL
        run: gcloud run services describe deploylens --project "${{ vars.GCP_PROJECT_ID }}" --region asia-east1 --format='value(status.url)'
